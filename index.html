<!DOCTYPE html>
<html>

<head>
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <script type="text/javascript" src="https://oapi.map.naver.com/openapi/v3/maps.js?ncpKeyId=s65fanh83m"></script>

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="2026년 7월 4일 토요일, 축복의 자리에 함께해주세요.">

  <!-- Open Graph / KakaoTalk Share -->
  <meta property="og:title" content="종우 & 채은 결혼합니다">
  <meta property="og:description" content="2026년 7월 4일 토요일, 축복의 자리에 함께해주세요.">
  <meta property="og:image" content="og_image.jpg">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="client">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png" />

  <title>종우 & 채은 결혼식에 초대합니다</title>
  <link rel="manifest" href="manifest.json">
  <style>
    html,
    body {
      background-color: #F0F7FF;
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      position: fixed;
      font-family: sans-serif;
    }

    #loading-app {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 9999;
      background-color: #F0F7FF;
      transition: opacity 0.3s ease;
    }

    /* Screen-wide cloud container */
    .clouds-background {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    .cloud {
      position: absolute;
      background: #fff;
      width: 120px;
      height: 40px;
      border-radius: 100px;
      opacity: 0.9;
      filter: drop-shadow(0 5px 15px rgba(255, 255, 255, 0.8));
      animation: moveObject linear infinite;
    }

    .cloud::after,
    .cloud::before {
      content: '';
      position: absolute;
      background: #fff;
    }

    .cloud::after {
      width: 60px;
      height: 60px;
      top: -30px;
      left: 20px;
      border-radius: 60px;
    }

    .cloud::before {
      width: 50px;
      height: 50px;
      top: -20px;
      right: 20px;
      border-radius: 50px;
    }

    /* Diverse clouds - Speed Up! */
    .cloud:nth-child(1) {
      top: 15%;
      animation-duration: 8s;
      transform: scale(0.8);
    }

    .cloud:nth-child(2) {
      top: 45%;
      animation-duration: 5s;
      transform: scale(1.3);
      animation-delay: -2s;
    }

    .cloud:nth-child(3) {
      top: 75%;
      animation-duration: 10s;
      transform: scale(1.0);
      animation-delay: -5s;
    }

    .cloud:nth-child(4) {
      top: 30%;
      animation-duration: 7s;
      transform: scale(0.6);
      animation-delay: -3s;
    }

    /* Airplane flying across - Speed Up! */
    .airplane-track {
      position: absolute;
      top: 50%;
      width: 100%;
      z-index: 10;
      transform: translateY(-50%);
    }

    .airplane-wrapper {
      position: absolute;
      left: -100px;
      animation: flying 3s linear infinite;
    }

    .airplane-icon {
      width: 80px;
      height: 80px;
      fill: #1E3A8A;
      transform: rotate(90deg);
      filter: drop-shadow(0 15px 25px rgba(30, 58, 138, 0.3));
    }

    .loading-info {
      position: absolute;
      bottom: 10%;
      width: 100%;
      text-align: center;
      z-index: 20;
    }

    .loading-text {
      color: #1E3A8A;
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0px;
    }

    .loading-text span {
      display: inline-block;
      animation: wave 1.2s ease-in-out infinite;
    }

    @keyframes wave {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-10px);
        color: #4A90E2;
      }
    }

    @keyframes moveObject {
      from {
        left: -200px;
      }

      to {
        left: 100%;
      }
    }

    @keyframes flying {
      0% {
        left: -100px;
        transform: translateY(0);
      }

      25% {
        transform: translateY(-20px);
      }

      50% {
        transform: translateY(0);
      }

      75% {
        transform: translateY(20px);
      }

      100% {
        left: 100%;
        transform: translateY(0);
      }
    }
  </style>
</head>

<body>
  <div id="loading-app">
    <div class="clouds-background">
      <div class="cloud"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>
      <div class="cloud"></div>
    </div>

    <div class="airplane-track">
      <div class="airplane-wrapper">
        <svg class="airplane-icon" viewBox="0 0 24 24">
          <path
            d="M21,16L13.5,11.5V11.5V5C13.5,3.9 12.6,3 11.5,3S9.5,3.9 9.5,5V11.5L2,16V18L9.5,15.5V20.5L7.5,22H15.5L13.5,20.5V15.5L21,18V16Z" />
        </svg>
      </div>
    </div>

    <div class="loading-info">
      <div class="loading-text" aria-label="설레는 마음으로 이륙 준비 중...">
        <span style="animation-delay: 0.0s">설</span>
        <span style="animation-delay: 0.1s">레</span>
        <span style="animation-delay: 0.2s">는</span>
        <span style="margin-right: 5px;"></span>
        <span style="animation-delay: 0.3s">마</span>
        <span style="animation-delay: 0.4s">음</span>
        <span style="animation-delay: 0.5s">으</span>
        <span style="animation-delay: 0.6s">로</span>
        <span style="margin-right: 5px;"></span>
        <span style="animation-delay: 0.7s">이</span>
        <span style="animation-delay: 0.8s">륙</span>
        <span style="margin-right: 5px;"></span>
        <span style="animation-delay: 0.9s">준</span>
        <span style="animation-delay: 1.0s">비</span>
        <span style="margin-right: 5px;"></span>
        <span style="animation-delay: 1.1s">중</span>
        <span style="animation-delay: 1.2s">.</span>
        <span style="animation-delay: 1.3s">.</span>
        <span style="animation-delay: 1.4s">.</span>
      </div>
    </div>
  </div>

  <script>
    // Remove loading screen when Flutter app is ready (with an intentional delay to show off the animation)
    window.addEventListener('flutter-first-frame', function () {
      var loadingApp = document.getElementById('loading-app');
      if (loadingApp) {
        // Wait for 1.2 seconds after the app is ready so the user can enjoy the airplane animation
        setTimeout(function () {
          loadingApp.style.opacity = '0';
          setTimeout(function () {
            loadingApp.remove();
          }, 300);
        }, 1200);
      }
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>


</html>
